name: Run Test Harness
permissions:
    contents: read
on:
    pull_request:
        branches: [main]

jobs:
    build:
        runs-on: ubuntu-24-arm-16-core
        strategy:
            matrix:
                node-version: ['24.x']
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - name: Install system dependencies
              run: |
                sudo apt-get update
                sudo apt-get install -y build-essential libcairo2-dev libpango1.0-dev libjpeg-dev libpixman-1-dev pkg-config
            - name: Enable Corepack
              run: corepack enable
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v4
              with:
                  node-version: ${{ matrix.node-version }}
                  cache: 'yarn'
            - name: Run Yarn
              run: yarn --immutable
            - name: Check affected projects
              run: |
                  if yarn nx print-affected --base=origin/main --select=projects | grep -E '(^nodejs|[^-]nodejs)'; then
                    echo "TRIGGER_NODEJS_TEST_HARNESS=true" >> $GITHUB_ENV
                  fi
            - name: Diagnose Docker build (capture install.sh output)
              if: contains(env.TRIGGER_NODEJS_TEST_HARNESS, 'true')
              continue-on-error: true
              run: |
                git clone --depth=1 https://github.com/DevCycleHQ/test-harness.git /tmp/th-debug
                echo "=== Building of-nodejs Docker image with full logs ==="
                docker buildx build \
                  --build-arg SDK_GITHUB_SHA=${{ github.event.pull_request.head.sha }} \
                  --build-arg SDKS_TO_TEST=of-nodejs \
                  --no-cache \
                  --progress=plain \
                  -f /tmp/th-debug/proxies/openfeature-nodejs/Dockerfile \
                  /tmp/th-debug/proxies/openfeature-nodejs/ 2>&1 || true
                echo "=== Docker build diagnostic done ==="
            - uses: DevCycleHQ/test-harness@main
              if: contains(env.TRIGGER_NODEJS_TEST_HARNESS, 'true')
              with:
                  sdks-to-test: nodejs,of-nodejs
                  sdk-github-sha: ${{github.event.pull_request.head.sha}}
                  github-token: ${{ secrets.AUTOMATION_USER_TOKEN }}
