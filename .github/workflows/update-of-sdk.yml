name: Update DevCycle SDKs to Latest
permissions:
  contents: write
  pull-requests: write
on:
  schedule:
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  update-dvc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'yarn'

      - name: Set Git author
        shell: bash
        run: |
          git config --global user.email "foundation-admin@devcycle.com"
          git config --global user.name "DevCycle Automation"

      - name: Set branch name
        shell: bash
        run: echo "BRANCH_NAME=update-of-sdk" >> $GITHUB_ENV

      - name: Update OpenFeature SDKs to latest
        # yarn up updates these in every workspace that depends on them (root and sdk/nodejs)
        run: yarn up --tilde @openfeature/core @openfeature/server-sdk @openfeature/web-sdk

      - name: Update @openfeature/web-sdk peerDependencies in sdk/openfeature-web-provider/package.json
        working-directory: sdk/openfeature-web-provider
        # yarn add --peer writes "*" unless a range is given
        run: yarn add --peer "@openfeature/web-sdk@^$(npm view @openfeature/web-sdk version)"

      - name: Check for changes
        shell: bash
        run: |
          if git diff --quiet; then
            echo "IS_UPDATED=false" >> $GITHUB_ENV
          else
            echo "IS_UPDATED=true" >> $GITHUB_ENV
          fi

      - name: Commit & push changes
        if: ${{ env.IS_UPDATED == 'true' }}
        shell: bash
        run: |
          git checkout -B "$BRANCH_NAME"
          git add package.json sdk/nodejs/package.json sdk/openfeature-web-provider/package.json yarn.lock
          git commit -m "chore(deps): update OpenFeature SDKs to latest"
          git push --force origin "$BRANCH_NAME"

      - name: Create Pull Request
        if: ${{ env.IS_UPDATED == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.AUTOMATION_USER_TOKEN }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH_NAME" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for $BRANCH_NAME, branch updated"
            exit 0
          fi
          gh pr create \
          --base main --head "$BRANCH_NAME" \
          --title "chore(deps): Update OpenFeature SDKs to latest" \
          --body "This PR is auto generated by this [github workflow](https://github.com/${{ github.repository }}/actions/workflows/update-of-sdk.yml)" \
          --reviewer DevCycleHQ/engineering
